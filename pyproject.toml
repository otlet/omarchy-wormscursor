[project]
name = "otlet-worms-cursor"
version = "1.0.1"
description = "Arrow cursor that rotates to follow mouse movement."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "1.0.1"
version_files = ["manifest.json:version"]
tag_format = "v$version"
